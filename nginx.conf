user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upload size (media library / product images / backups)
    # Default is 1m which easily triggers 413 for normal photos.
    client_max_body_size 1100m;

    # 日志配置
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩 - SEO优化，包含sitemap和robots文件
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 反向代理缓存优化
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Rate limiting zones used by the server block below.
    # (limit_req_zone is only valid inside the http{} context.)
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

    # SSL 设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 服务器配置
    server {
        listen 80;
        server_name www.vibocnc.com vibocnc.com;

        # HTTP 自动跳转 HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.vibocnc.com vibocnc.com;

        ssl_certificate     /root/.acme.sh/www.vibocnc.com_ecc/fullchain.cer;
        ssl_certificate_key /root/.acme.sh/www.vibocnc.com_ecc/www.vibocnc.com.key;

        # SEO优化：确保使用www域名
        if ($host = vibocnc.com) {
            return 301 https://www.vibocnc.com$request_uri;
        }

        # SEO和安全头部
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Prevent spoofed Next.js middleware internals from reaching the app.
        proxy_set_header x-middleware-subrequest "";

        # Production Next.js frontend should not receive WebSocket upgrade requests.
        if ($http_upgrade ~* "websocket") {
            return 400;
        }

        # Next.js 静态资源 - 仅对真正的静态资源缓存
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3000;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SEO关键文件 - 无缓存确保搜索引擎获取最新内容
        location = /favicon.ico {
            proxy_pass http://127.0.0.1:3000;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            proxy_pass http://127.0.0.1:3000/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (never append) X-Forwarded-For: client-supplied values must not reach
            # the backend, otherwise rate limiting and audit client IPs can be spoofed.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            access_log off;
            log_not_found off;
        }

        # 主sitemap - 无缓存确保搜索引擎获取最新内容
        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:3000/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # 所有sitemap文件 - 无缓存确保搜索引擎获取最新内容
        location ~* ^/sitemap.*\.xml$ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Content-Type "application/xml" always;
        }

        # API 路由代理到后端 - 这是关键配置！
        location /api/ {
            # General API rate limit (allows bursts)
            limit_req zone=api_zone burst=60 nodelay;

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            client_max_body_size 1100m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
            proxy_request_buffering off;

            # CORS is owned by the application (see backend/middleware/cors.go).
            # Do not emit a wildcard here: it would let any origin read API
            # responses and would conflict with credentialed requests.

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;

            # 不缓存API响应
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Stricter rate limit for login (protect against brute force)
        location = /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            client_max_body_size 2m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # 健康检查端点代理
        location /health {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # 产品页面 - SEO优化，无缓存确保搜索引擎获取最新内容
        location ~* ^/products/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;

            # SEO优化：无缓存确保搜索引擎获取最新产品信息
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # SEO友好的头部（由页面自行控制 robots）
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 分类页面 - SEO优化，无缓存
        location ~* ^/categories/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;

            # SEO优化：无缓存确保搜索引擎获取最新分类信息
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # SEO友好的头部（由页面自行控制 robots）
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 反代 Next.js - 其他页面
        # Locale-prefixed public pages are the same cacheable document for all
        # visitors. The unprefixed entry remains private because middleware
        # can redirect it based on Accept-Language and country headers.
        location ~ ^/(zh|es|de|fr|it|pt|ja|ko|ru|ar)(/)?$ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;

            # The bare entry can be redirected by locale negotiation, so keep
            # it private instead of sharing one language variant at the edge.
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, max-age=0, must-revalidate" always;

            # SEO友好的头部（由页面自行控制 robots）
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }
    }
}
