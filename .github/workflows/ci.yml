name: CI

# Locks in the quality gates that the security hardening depends on. Without
# this, a future commit can silently drop a rate limit, a cookie flag, or a
# type check and nothing will notice until production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Race detector matters here: the rate limiter and the visitor-log writer
      # both hold shared state across goroutines.
      - name: Test (race)
        run: go test -race ./...

  frontend:
    name: Frontend (types / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1
          NEXT_PUBLIC_SITE_URL: https://vibocnc.com

  infra-lint:
    name: Infra (nginx client-IP handling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backend trusts forwarding headers coming from RFC1918 peers, so the
      # edge proxy must overwrite X-Forwarded-For with $remote_addr. Appending
      # ($proxy_add_x_forwarded_for) lets a client smuggle an arbitrary IP into
      # rate limiting and audit logs whenever the backend is reachable directly.
      - name: Nginx must overwrite X-Forwarded-For
        run: |
          set -eu
          files="nginx/sites-enabled/www.vibocnc.com.conf nginx.conf docker/nginx.conf frontend/nginx.conf nginx/conf.d/www.vibocnc.com.conf"

          offenders="$(grep -n '\$proxy_add_x_forwarded_for' $files || true)"
          if [ -n "$offenders" ]; then
            echo "These configs append client supplied X-Forwarded-For:"
            echo "$offenders"
            exit 1
          fi

          for f in $files; do
            if ! grep -q 'proxy_set_header X-Forwarded-For \$remote_addr;' "$f"; then
              echo "$f does not overwrite X-Forwarded-For with \$remote_addr"
              exit 1
            fi
          done

      # scripts/preflight-env.sh is the gate an operator runs before deploying.
      # Lock its behaviour: a hardened env must pass, and the shipped template
      # (placeholders) must fail, so the script never silently becomes a no-op.
      - name: Production preflight must pass on a hardened env
        run: |
          set -eu
          cat > /tmp/hardened.env <<'ENV'
          MYSQL_ROOT_PASSWORD=s3cure-root-password-value
          MYSQL_DATABASE=vibocnc_sales
          MYSQL_USER=vibocnc
          MYSQL_PASSWORD=s3cure-app-password-value
          JWT_SECRET=0123456789abcdef0123456789abcdef0123456789
          SETTINGS_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          REVALIDATE_SECRET=0123456789abcdef0123456789abcdef
          CORS_ORIGINS=https://www.example.com
          CORS_ALLOW_CHROME_EXTENSIONS=false
          AUTH_COOKIE_SECURE=true
          API_VERBOSE_ERRORS=false
          SEED_DEFAULT_ADMIN=false
          RESET_DEFAULT_ADMIN_PASSWORD=false
          TRUSTED_PROXIES=127.0.0.1,::1
          REDIS_ADDR=redis:6379
          AI_CLASSIFICATION_MIN_CONFIDENCE=0.9
          ENV
          sed -i 's/^          //' /tmp/hardened.env
          bash scripts/preflight-env.sh /tmp/hardened.env

      - name: Production preflight must reject the placeholder template
        run: |
          set -eu
          if bash scripts/preflight-env.sh .env.docker.example; then
            echo "preflight accepted an env full of placeholders"
            exit 1
          fi
          echo "preflight correctly rejected the template"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap guard against committed credentials. Focuses on high-signal
      # patterns to keep the false-positive rate near zero.
      - name: Scan tracked files for committed secrets
        run: |
          set -eu
          matches="$(git grep -nIE \
            '(BEGIN [A-Z ]*PRIVATE KEY|sk_live_[0-9A-Za-z]{10,}|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{20,}|xox[baprs]-[0-9A-Za-z-]{10,})' \
            -- . ':(exclude)*.example' ':(exclude)*.md' || true)"
          if [ -n "$matches" ]; then
            echo "Potential secrets found in tracked files:"
            echo "$matches"
            exit 1
          fi

      # An .env file must never be tracked (only *.example may be).
      - name: Ensure no .env files are tracked
        run: |
          offenders="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)"
          if [ -n "$offenders" ]; then
            echo "These environment files are tracked and must be removed:"
            echo "$offenders"
            exit 1
          fi
