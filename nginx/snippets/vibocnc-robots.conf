# Include inside both HTTPS server blocks, before location / redirects.
# Install at /etc/nginx/snippets/vibocnc-robots.conf.
# A server-level return would run before this location, so canonical-host
# redirects must be inside location / when this snippet is used.
location = /robots.txt {
    proxy_pass http://vibocnc_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host vibocnc.com;
    proxy_set_header X-Forwarded-Host vibocnc.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    proxy_buffering off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
